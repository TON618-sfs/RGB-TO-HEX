name: Build and deploy Flet web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        env:
          APP_DIR: "RGB TO HEX GUI"
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.28.0"
          if [ -f "$APP_DIR/requirements.txt" ]; then pip install -r "$APP_DIR/requirements.txt"; fi

      - name: Build web app
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
          APP_DIR: "RGB TO HEX GUI"
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          flet build web "$APP_DIR" --yes --verbose \
            --base-url "$REPO_NAME" \
            --route-url-strategy hash \
            --output "$GITHUB_WORKSPACE/web-out"
          test -f "$GITHUB_WORKSPACE/web-out/index.html" || { echo "index.html not found in web-out"; ls -R "$GITHUB_WORKSPACE" | head -50; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
